[project]
name = "rebeat-ml"
version = "0.1.0"
description = "Training the beatbox hit classifier for Rebeat"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "soundfile>=0.12",
  "torch>=2.5",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rebeat_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
